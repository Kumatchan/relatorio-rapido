name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Gerar Projeto Android Oficial
        run: |
          flutter create . --platforms=android --org=com.relatoriorapido
          flutter pub get

      - name: Injetar Permissões no AndroidManifest
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.relatoriorapido.app">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.SEND" />
                      <data android:mimeType="*/*" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.SENDTO" />
                      <data android:scheme="mailto" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>
              <application
                  android:label="Relatório Rápido"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:requestLegacyExternalStorage="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Compilar APK de Produção
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Disponibilizar APK nos Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-rapido-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar Release com download direto do APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Relatório Rápido v1.0.0 (Instalador Android)"
          body: "📱 Clique em **app-release.apk** abaixo para baixar e instalar no seu celular Android."
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
