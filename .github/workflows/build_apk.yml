name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Baixar dependências
        run: flutter pub get

      - name: Compilar APK de Produção
        run: flutter build apk --release

      - name: Disponibilizar APK nos Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-rapido-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar Release com download direto do APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Relatório Rápido v1.0.0 (Instalador Android)"
          body: "📱 Clique em **app-release.apk** abaixo para baixar e instalar no seu celular Android."
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
